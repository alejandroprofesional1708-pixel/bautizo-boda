<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fondo de video</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
        }

        /* VIDEO COMO FONDO RAÍZ */
        .video-fondo-root {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: -1;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <video class="video-fondo-root" autoplay muted loop playsinline preload="auto">
        <source src="White_rose_blooming_and_closing_20261010190041.mp4" type="video/mp4">
    </video>

</body>
</html>
