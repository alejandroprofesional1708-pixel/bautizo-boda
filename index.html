
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nuestra Boda & Bautizo - Juliana y Manuel</title>
    <link href="https://googleapis.com" rel="stylesheet">
    <style>
        :root { --dorado: #c5a059; --oscuro: #212529; --fondo: #fbf9f6; --blanco: #ffffff; --gris-suave: #f8f9fa; }
        body { font-family: 'Montserrat', sans-serif; background-color: var(--fondo); color: var(--oscuro); margin: 0; padding: 0; min-height: 100vh; display: flex; justify-content: center; align-items: center; }
        .invitacion-frame { width: 100%; max-width: 1240px; height: 90vh; max-height: 1080px; background: var(--blanco); box-shadow: 0 15px 50px rgba(0,0,0,0.05); border-radius: 20px; border: 1px solid #eae5dc; position: relative; overflow: hidden; display: flex; flex-direction: column; box-sizing: border-box; margin: 20px; }
        .flor-decorativa { position: absolute; width: 240px; height: auto; pointer-events: none; z-index: 10; opacity: 0.85; }
        .flor-top { top: -15px; left: -15px; }
        .flor-bottom { bottom: 50px; right: -15px; transform: rotate(180deg); }
        .seccion-vista { display: none; flex: 1; overflow-y: auto; padding: 60px 40px 100px 40px; box-sizing: border-box; text-align: center; }
        .seccion-vista.activa { display: block; }
        .intro-label { font-family: 'Cinzel', serif; font-size: 13px; letter-spacing: 4px; color: var(--dorado); text-transform: uppercase; margin-bottom: 15px; }
        h1.nombres { font-family: 'Great Vibes', cursive; font-size: 64px; color: var(--dorado); margin: 10px 0; font-weight: normal; }
        .historia-texto { max-width: 750px; margin: 25px auto; font-size: 16px; line-height: 1.9; color: #555; font-style: italic; font-weight: 300; }
        .box-invitado { background-color: var(--gris-suave); border: 1px dashed var(--dorado); max-width: 450px; margin: 30px auto; padding: 20px; border-radius: 12px; }
        .pases-tag { display: inline-block; background-color: #f4eae1; color: #8c6f37; font-size: 12px; padding: 5px 15px; border-radius: 20px; font-weight: 600; margin: 5px; }
        .contador-container { display: flex; justify-content: center; gap: 15px; margin: 35px 0; }
        .contador-bloque { background: var(--gris-suave); border: 1px solid #eee; min-width: 75px; padding: 12px; border-radius: 10px; }
        .contador-num { font-size: 24px; font-weight: 600; color: var(--dorado); }
        .contador-label { font-size: 10px; text-transform: uppercase; color: #888; letter-spacing: 1px; }
        .btn-asistencia { display: inline-block; background-color: var(--dorado); color: white; text-decoration: none; padding: 15px 40px; border-radius: 30px; font-size: 13px; font-weight: 600; letter-spacing: 2px; text-transform: uppercase; margin-top: 20px; box-shadow: 0 4px 15px rgba(197,160,89,0.3); }
        .nav-inferior { position: absolute; bottom: 0; left: 0; width: 100%; height: 60px; background: var(--blanco); border-top: 1px solid #eae5dc; display: flex; justify-content: space-around; align-items: center; z-index: 100; }
        .nav-item { flex: 1; text-align: center; padding: 10px 0; font-size: 11px; text-transform: uppercase; letter-spacing: 1px; color: #777; cursor: pointer; font-weight: 600; }
        .nav-item.activo { color: var(--dorado); }
    </style>
</head>
<body>
    <div class="invitacion-frame">
        <div id="vista-inicio" class="seccion-vista activa">
            <div class="intro-label">Nuestra Boda & Bautizo</div>
            <h1 class="nombres">Juliana Cañas & Manuel Álvarez</h1>
            <p class="historia-texto">Celebra con nosotros la unión de nuestras vidas y el bautizo de nuestro amor.</p>
            <div class="box-invitado">
                <div id="txt-titulo">Invitado Especial</div>
                <div id="txt-nombre">Amigo o Familiar</div>
                <span class="pases-tag" id="txt-cupos">1 Pase</span>
            </div>
        </div>
        <div class="nav-inferior">
            <div class="nav-item activo" onclick="irAPestana('inicio', this)">Inicio</div>
        </div>
    </div>
    <script>
        function irAPestana(id, el) {
            document.querySelectorAll('.seccion-vista').forEach(v => v.classList.remove('activa'));
            document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('activo'));
            document.getElementById(`vista-${id}`).classList.add('activa');
            el.classList.add('activo');
        }
    </script>
</body>
</html>
