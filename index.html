<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nuestra Boda y Bautizo</title>
    <!-- Fuentes premium de Google Fonts -->
    <link href="https://googleapis.com" rel="stylesheet">
    <style>
        :root {
            --dorado: #c5a059;
            --oscuro: #333333;
            --fondo: #fbf9f6;
        }
        body {
            font-family: 'Montserrat', sans-serif;
            background-color: var(--fondo);
            color: var(--oscuro);
            margin: 0; padding: 0;
            display: flex; justify-content: center; align-items: center;
            min-height: 100vh;
        }
        
        /* PANTALLA SOBRE (BIENVENIDA) */
        #pantalla-sobre {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(135deg, #1a1a1a, #2c2c2c);
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            z-index: 1000; transition: opacity 0.8s ease; text-align: center; color: white;
        }
        .sobre-icono { font-size: 80px; animation: flotar 3s ease-in-out infinite; cursor: pointer; }
        .btn-abrir {
            margin-top: 20px; background-color: var(--dorado); color: white; border: none;
            padding: 12px 35px; font-size: 14px; text-transform: uppercase; letter-spacing: 2px;
            border-radius: 25px; cursor: pointer; box-shadow: 0 4px 15px rgba(197,160,89,0.4); font-weight: 600;
        }

        /* CONTENEDOR PRINCIPAL RESPONSIVE */
        .invitacion-container {
            max-width: 500px; width: 90%; background: white; margin: 30px auto;
            padding: 70px 25px 40px 25px; box-shadow: 0 10px 40px rgba(0,0,0,0.04);
            border-radius: 16px; text-align: center; border: 1px solid #eae5dc; 
            box-sizing: border-box; position: relative; overflow: hidden;
        }

        /* CONFIGURACIÓN DE LAS IMÁGENES DE ROSAS EN LAS ESQUINAS */
        .flor-esquina {
            position: absolute;
            width: 150px; /* Tamaño adaptable óptimo para móviles */
            height: auto;
            opacity: 0.9;
            pointer-events: none; /* Evita que interfiera con los clics del usuario */
            z-index: 1;
        }
        .flor-top-left {
            top: 0;
            left: 0;
        }
        .flor-bottom-right {
            bottom: 0;
            right: 0;
            transform: rotate(180deg); /* Gira la imagen para la esquina inferior */
        }

        /* ELEMENTOS DE TEXTO */
        h1 { font-family: 'Great Vibes', cursive; font-size: 52px; color: var(--dorado); margin: 15px 0; font-weight: normal; position: relative; z-index: 2; }
        h2 { font-size: 12px; text-transform: uppercase; letter-spacing: 4px; color: #777; margin-bottom: 25px; position: relative; z-index: 2; }
        p.introduccion { font-style: italic; color: #666; font-size: 14px; padding: 0 15px; position: relative; z-index: 2; }
        
        /* BLOQUE DINÁMICO DE INVITADO */
        .seccion-invitado { 
            background-color: #fdfcfb; border: 1px dashed var(--dorado); 
            padding: 20px; border-radius: 10px; margin: 25px 0; position: relative; z-index: 2;
        }
        .badge-invitado { font-size: 11px; letter-spacing: 2px; text-transform: uppercase; color: var(--dorado); font-weight: 600; }
        .nombre-invitado { font-size: 22px; font-weight: 400; margin: 8px 0; color: var(--oscuro); }
        .detalles-pases { font-size: 13px; color: #666; margin-top: 5px; }
        
        /* SECCIÓN FORMULARIO GOOGLE FORMS */
        .form-container {
            margin-top: 30px; border-top: 1px solid #f0eae1; padding-top: 25px; position: relative; z-index: 2;
        }
        iframe { width: 100%; height: 550px; border: none; border-radius: 10px; background-color: #ffffff; }
        
        @keyframes flotar {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-15px); }
            100% { transform: translateY(0px); }
        }
    </style>
</head>
<body>

    <!-- PANTALLA SOBRE (BIENVENIDA) -->
    <div id="pantalla-sobre">
        <div class="sobre-icono" onclick="abrirInvitacion()">✉️</div>
        <p style="letter-spacing: 3px; font-size: 13px; text-transform: uppercase; margin-top: 15px;">Tienes una invitación especial</p>
        <h3 id="sobre-nombre" style="font-family: 'Great Vibes', cursive; font-size: 35px; color: var(--dorado); font-weight: normal; margin: 10px 0;">Invitado</h3>
        <button class="btn-abrir" onclick="abrirInvitacion()">Abrir sobre</button>
    </div>

    <!-- CONTENIDO PRINCIPAL DE LA INVITACIÓN -->
    <div class="invitacion-container">
        
        <!-- CAMBIO A IMÁGENES REALES EN LAS ESQUINAS -->
        <img class="flor-esquina flor-top-left" src="esquina-rosas.png" alt="Flores decorativas superiores">
        <img class="flor-esquina flor-bottom-right" src="esquina-rosas.png" alt="Flores decorativas inferiores">

        <h2>Invitación Especial</h2>
        <h1>Nuestra Boda & Bautizo</h1>
        <p class="introduccion">
            "Este sueño no estaría completo sin ti. Acompáñanos en nuestra historia de amor."
        </p>
        
        <!-- SECCIÓN DINÁMICA DE INVITADO -->
        <div class="seccion-invitado">
            <div class="badge-invitado" id="txt-titulo">Invitado Especial</div>
            <div class="nombre-invitado" id="txt-nombre">Amigo o Familiar</div>
            <div class="detalles-pases">
                <span id="txt-cupos">Cupos confirmados: 1</span> | 
                <span id="txt-mesa">Mesa asignada: General</span>
            </div>
        </div>

        <!-- SECCIÓN FORMULARIO INCRUSTADO -->
        <div class="form-container">
            <h2 style="margin-bottom: 15px;">Confirmar Asistencia</h2>
            <iframe id="google-form" src="about:blank">Cargando formulario...</iframe>
        </div>
    </div>

    <script>
        // Animación para desvanecer el sobre
        function abrirInvitacion() {
            const sobre = document.getElementById('pantalla-sobre');
            sobre.style.opacity = '0';
            setTimeout(() => { sobre.style.display = 'none'; }, 800);
        }

        // Lectura de parámetros dinámicos desde la URL
        const params = new URLSearchParams(window.location.search);
        const titulo = params.get('titulo') || 'Invitado Especial';
        const nombre = params.get('nombre') || 'Amigo o Familiar';
        const cupos = params.get('cupos') || '1';
        const mesa = params.get('mesa') || 'Por asignar';

        // Renderizado de datos en la web
        document.getElementById('sobre-nombre').innerText = nombre;
        document.getElementById('txt-titulo').innerText = titulo;
        document.getElementById('txt-nombre').innerText = nombre;
        document.getElementById('txt-cupos').innerText = `Cupos confirmados: ${cupos}`;
        document.getElementById('txt-mesa').innerText = `Mesa: ${mesa}`;

        // CONEXIÓN DINÁMICA CON TU GOOGLE FORM RELLENADO PREVIAMENTE
        // Reemplaza esta URL por el enlace real terminado en /viewform de tu formulario
        const urlBaseForm = "https://google.com";
        // Reemplaza este id de campo por el tuyo correspondiente a la pregunta del Nombre
        const idPreguntaNombre = "entry.12345678"; 

        const urlFinalForm = `${urlBaseForm}?embedded=true&${idPreguntaNombre}=${encodeURIComponent(nombre)}`;
        document.getElementById('google-form').src = urlFinalForm;
    </script>
</body>
</html>
